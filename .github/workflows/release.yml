name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  packages-deb-rpm:
    name: Build DEB/RPM packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6dbus6 \
            libevdev-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libtag1-dev \
            libwayland-dev \
            rpm

      - name: Configure
        run: >
          cmake
          -S cpp
          -B cpp/build-Release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build cpp/build-Release

      - name: Package
        run: |
          cd cpp/build-Release
          cpack -G "DEB;RPM"
          ls -la *.deb *.rpm

      - name: Upload DEB/RPM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-deb-rpm
          path: |
            cpp/build-Release/*.deb
            cpp/build-Release/*.rpm

  packages-arch:
    name: Build Arch package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git \
            cmake \
            ninja \
            pkgconf \
            qt6-base \
            libevdev \
            libpulse \
            libpipewire \
            taglib \
            pipewire \
            wayland \
            layer-shell-qt \
            base-devel

      - name: Build Arch package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /tmp/arch-out
          chown -R builder:builder . /tmp/arch-out
          chmod +x pkg/arch/build-release-package.sh
          # makepkg must not run as root
          sudo -u builder env OUT_DIR="/tmp/arch-out" \
            bash pkg/arch/build-release-package.sh "${VERSION}"
          mkdir -p release-arch
          cp /tmp/arch-out/*.pkg.tar.zst release-arch/
          ls -la release-arch/

      - name: Upload Arch artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-arch
          path: release-arch/*.pkg.tar.zst

  publish:
    name: Publish GitHub Release
    needs: [packages-deb-rpm, packages-arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download DEB/RPM artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-deb-rpm
          path: dist

      - name: Download Arch artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-arch
          path: dist

      - name: Build SHA256SUMS and release notes
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS.txt
          ls -la
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; print; next}
            /^## \[/ {flag=0}
            flag {print}
          ' ../CHANGELOG.md > ../release-notes.md
          if [[ ! -s ../release-notes.md ]]; then
            printf '## %s\n\nSee CHANGELOG.md in the repository.\n' "$GITHUB_REF_NAME" > ../release-notes.md
          fi
          cat ../release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # CHANGELOG.md is the single source of truth; do not append auto PR lists.
          generate_release_notes: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/SHA256SUMS.txt
