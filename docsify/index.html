<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Keyboard Volume App documentation in English and Polish">
  <title>Keyboard Volume App documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="theme.css?v=20261119-4">
  <script>
    // Apply before the page is painted to avoid flashing the wrong theme.
    try {
      const saved = localStorage.getItem('kva-docs-theme');
      document.documentElement.dataset.theme = ['light', 'dark', 'oled'].includes(saved)
        ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
</head>
<body>
  <header class="site-header">
    <button class="mobile-menu" type="button" aria-label="Open navigation / Otwórz nawigację" aria-expanded="false" aria-controls="docs-navigation">☰</button>
    <a class="brand" href="#/" aria-label="Keyboard Volume App – home"><span class="brand-icon" aria-hidden="true">◖))</span><span>Keyboard Volume App <small>Docs</small></span></a>
    <div class="header-actions">
    <a class="github-link" href="https://github.com/Adiker/keyboard-volume-app">GitHub <span aria-hidden="true">↗</span></a>
  <div class="theme-switcher">
    <label for="theme-select">Theme / Motyw</label>
    <select id="theme-select" aria-label="Theme / Motyw">
      <option value="light">Light / Jasny</option>
      <option value="dark">Dark / Ciemny</option>
      <option value="oled">OLED</option>
    </select>
  </div>
    </div>
  </header>
  <div id="app">Loading documentation…</div>
  <aside class="page-toc" aria-label="On this page / Na tej stronie" hidden>
    <div class="toc-heading">On this page <span>/ Na tej stronie</span></div>
    <nav></nav>
  </aside>
  <script>
    const menuButton = document.querySelector('.mobile-menu');
    menuButton.addEventListener('click', () => {
      const open = document.body.classList.toggle('mobile-nav-open');
      menuButton.setAttribute('aria-expanded', String(open));
    });
    const themeSelect = document.getElementById('theme-select');
    themeSelect.value = document.documentElement.dataset.theme;
    themeSelect.addEventListener('change', () => {
      document.documentElement.dataset.theme = themeSelect.value;
      try { localStorage.setItem('kva-docs-theme', themeSelect.value); } catch (_) { /* Optional persistence. */ }
    });
    window.$docsify = {
      name: '',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      plugins: [function (hook) {
        hook.doneEach(function () {
          document.body.classList.remove('mobile-nav-open');
          menuButton.setAttribute('aria-expanded', 'false');
          const sidebar = document.querySelector('.sidebar');
          if (sidebar) sidebar.id = 'docs-navigation';
          const toc = document.querySelector('.page-toc');
          const nav = toc.querySelector('nav');
          nav.replaceChildren();
          document.querySelectorAll('.markdown-section h2, .markdown-section h3').forEach(function (heading) {
            const anchor = heading.querySelector('a.anchor');
            if (!anchor) return;
            const link = document.createElement('a');
            link.href = anchor.getAttribute('href');
            link.textContent = heading.textContent.trim();
            if (heading.tagName === 'H3') link.className = 'toc-subheading';
            nav.appendChild(link);
          });
          toc.hidden = !nav.childElementCount;
        });
      }],
      search: {
        paths: 'auto',
        placeholder: 'Search / Szukaj',
        noData: 'No results / Brak wyników',
        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
