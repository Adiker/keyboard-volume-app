<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Keyboard Volume App documentation in English and Polish">
  <title>Keyboard Volume App documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="theme.css">
  <script>
    // Apply before the page is painted to avoid flashing the wrong theme.
    try {
      const saved = localStorage.getItem('kva-docs-theme');
      document.documentElement.dataset.theme = ['light', 'dark', 'oled'].includes(saved)
        ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
</head>
<body>
  <div class="theme-switcher">
    <label for="theme-select">Theme / Motyw</label>
    <select id="theme-select" aria-label="Theme / Motyw">
      <option value="light">Light / Jasny</option>
      <option value="dark">Dark / Ciemny</option>
      <option value="oled">OLED</option>
    </select>
  </div>
  <div id="app">Loading documentation…</div>
  <script>
    const themeSelect = document.getElementById('theme-select');
    themeSelect.value = document.documentElement.dataset.theme;
    themeSelect.addEventListener('change', () => {
      document.documentElement.dataset.theme = themeSelect.value;
      try { localStorage.setItem('kva-docs-theme', themeSelect.value); } catch (_) { /* Optional persistence. */ }
    });
    window.$docsify = {
      name: 'Keyboard Volume App',
      repo: 'Adiker/keyboard-volume-app',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      search: {
        paths: 'auto',
        placeholder: 'Search / Szukaj',
        noData: 'No results / Brak wyników',
        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
